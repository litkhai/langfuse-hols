# ─────────────────────────────────────────────────────────────────────────────
#  Enterprise Edition (EE) overlay — labs 05–07
#
#  Adds the enterprise license key to BOTH Langfuse containers. The key unlocks:
#    • Project-level RBAC roles  (lab 06) • Audit Logs         (lab 07)
#    • Data Retention policies   (lab 07) • SCIM / Org API      (lab 06)
#    • Server-side data masking  (lab 08) • Protected prompt labels (lab 09)
#    • UI customization          (lab 10) • Org creators allowlist  (lab 10)
#    • Instance Management API   (lab 05)
#
#  Feature-specific overlays layer ON TOP of this one:
#    docker-compose.masking.yml     (lab 08) · docker-compose.governance.yml (lab 10)
#
#  Usage (merge overlay on top of the base compose; the base file always comes first,
#  and relative paths resolve against `_base/` — the first file's directory). The track's
#  versions.env is required (#33); lf_compose passes it and _base/.env for you:
#    . _base/lib/env.sh v4 && lf_compose ee -- up -d      (or: EE=1 _base/bin/up.sh v4)
#  by hand:
#    docker compose --env-file _base/v4/versions.env --env-file _base/.env \
#                   -f _base/docker-compose.yml -f _base/docker-compose.ee.yml up -d
#
#  The `:?` guard makes compose FAIL FAST with a clear message if you forgot to
#  set LANGFUSE_EE_LICENSE_KEY in _base/.env. Core/OSS features never need this file.
#  https://langfuse.com/self-hosting/license-key
# ─────────────────────────────────────────────────────────────────────────────
services:
  langfuse-worker:
    environment:
      LANGFUSE_EE_LICENSE_KEY: ${LANGFUSE_EE_LICENSE_KEY:?Set LANGFUSE_EE_LICENSE_KEY in _base/.env to enable Enterprise features}

  langfuse-web:
    environment:
      LANGFUSE_EE_LICENSE_KEY: ${LANGFUSE_EE_LICENSE_KEY:?Set LANGFUSE_EE_LICENSE_KEY in _base/.env to enable Enterprise features}
      # Instance Management API (/api/admin/*) — Bearer-authenticated with this key.
      # Used by 06-ee-rbac-scim.sh to create orgs + org-scoped API keys.
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
