# Agent gateway (Kong Gateway OSS 3.9.4, DB-less): a plain reverse proxy in front of the agent.
# Kong starts the trace (or joins an incoming traceparent), injects traceparent upstream, and
# exports its own spans to the same Langfuse project as the model gateway. The pre-function maps
# the header contract to Langfuse attributes on every Kong span; no ai-proxy here.
_format_version: "3.0"

services:
  - name: agent
    url: http://host.docker.internal:18200     # 04-agent-through-gateways.py listens here
    routes:
      - name: agent
        paths: [/agent]
        plugins:
          - name: pre-function
            config:
              log:
                - |
                  local tracing = kong.tracing
                  local root = tracing.get_root_span()
                  if not root then return end
                  local h = kong.request.get_header
                  local shared = {
                    ["langfuse.user.id"] = h("x-user-id"),
                    ["langfuse.session.id"] = h("x-session-id"),
                    ["langfuse.trace.metadata.agent_id"] = h("x-agent-id"),
                    ["langfuse.trace.metadata.project_id"] = h("x-project-id"),
                    ["langfuse.trace.metadata.gateway"] = "agent",
                  }
                  if not root.parent_id then root:set_attribute("langfuse.trace.name", "agent-gateway " .. kong.router.get_route().name) end
                  for _, s in ipairs(tracing.get_spans() or {}) do
                    for k, v in pairs(shared) do s:set_attribute(k, v) end
                  end

plugins:
  - name: opentelemetry
    config:
      traces_endpoint: http://host.docker.internal:3000/api/public/otel/v1/traces
      headers:
        Authorization: "{vault://env/lf-otel-auth}"
        x-langfuse-ingestion-version: "4"
      resource_attributes:
        service.name: kong-agent-gateway
      propagation:
        extract: [w3c]
        inject: [w3c]
        default_format: w3c
      http_response_header_for_traceid: x-trace-id
