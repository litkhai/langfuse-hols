# kind cluster shaped like the AKS layout in values-aks.yaml: one `app` worker and three
# `clickhouse` workers tainted dedicated=clickhouse:NoSchedule (one ClickHouse replica each).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: langfuse-aks
nodes:
  - role: control-plane
  - role: worker
    labels: { agentpool: app }
  - role: worker
    labels: { agentpool: clickhouse }
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints: [{ key: dedicated, value: clickhouse, effect: NoSchedule }]
  - role: worker
    labels: { agentpool: clickhouse }
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints: [{ key: dedicated, value: clickhouse, effect: NoSchedule }]
  - role: worker
    labels: { agentpool: clickhouse }
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints: [{ key: dedicated, value: clickhouse, effect: NoSchedule }]
