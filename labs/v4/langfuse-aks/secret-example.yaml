# secret-example.yaml — the keys values-aks.yaml reads from one Secret named `langfuse`.
# Do not fill this file in and commit it: create the Secret from your secret store
# (Azure Key Vault + the Secrets Store CSI driver, External Secrets, or kubectl from a pipeline).
#   kubectl -n langfuse create secret generic langfuse \
#     --from-literal=nextauth-secret="$(openssl rand -hex 32)" \
#     --from-literal=salt="$(openssl rand -hex 32)" \
#     --from-literal=encryption-key="$(openssl rand -hex 32)" \
#     --from-literal=license-key=<Enterprise licence key> \
#     --from-literal=clickhouse-password="$(openssl rand -hex 16)" \
#     --from-literal=postgresql-password=<Azure PostgreSQL password for user langfuse> \
#     --from-literal=redis-password=<Azure Managed Redis access key> \
#     --from-literal=azure-storage-key=<storage account key>
apiVersion: v1
kind: Secret
metadata:
  name: langfuse
  namespace: langfuse
type: Opaque
stringData:
  nextauth-secret: <openssl rand -hex 32>
  salt: <openssl rand -hex 32>
  encryption-key: <openssl rand -hex 32, 64 hex characters>
  license-key: <Enterprise licence key; remove licenseKey from values-aks.yaml for OSS>
  clickhouse-password: <random>
  postgresql-password: <Azure PostgreSQL password>
  redis-password: <Azure Managed Redis access key>
  azure-storage-key: <storage account key>
