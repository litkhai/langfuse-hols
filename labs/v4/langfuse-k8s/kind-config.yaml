# kind cluster shaped like the node pools in values-base.yaml: one `app` worker and three
# `clickhouse` workers tainted dedicated=clickhouse:NoSchedule (one ClickHouse replica each).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: langfuse-k8s
nodes:
  - role: control-plane
  - role: worker
    labels: { workload: app }
  - role: worker
    labels: { workload: clickhouse }
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints: [{ key: dedicated, value: clickhouse, effect: NoSchedule }]
  - role: worker
    labels: { workload: clickhouse }
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints: [{ key: dedicated, value: clickhouse, effect: NoSchedule }]
  - role: worker
    labels: { workload: clickhouse }
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints: [{ key: dedicated, value: clickhouse, effect: NoSchedule }]
