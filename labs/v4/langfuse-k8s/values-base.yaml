# values-base.yaml — self-hosted Langfuse on managed Kubernetes, sized with room to spare (chart langfuse 2.2.1).
# Layer one cloud file on top:
#
#   helm install langfuse langfuse/langfuse --version 2.2.1 -n langfuse -f values-base.yaml -f values-aks.yaml
#                                                                             (or values-eks.yaml, values-gke.yaml)
#
# What is the same on every cloud lives here: sizing, node placement, HPA/PDB, ClickHouse 1 shard × 3 replicas
# and Keeper 3 through the operator, and "use external Postgres, Redis and object storage". The cloud file sets
# the storage class, the ingress, the managed services' addresses and the identity.
#
# Node pools, created with this label and taint on every cloud (AKS --labels/--node-taints, EKS managed node
# group labels/taints, GKE node pool label/--node-taints):
#   workload=app         web ×2, worker ×2 (HPA), Keeper ×3        e.g. 3 nodes, 4 vCPU / 16 GiB
#   workload=clickhouse  ClickHouse, one replica per node           3 nodes, 8 vCPU / 32 GiB,
#                        taint dedicated=clickhouse:NoSchedule
#
# Every <…> is a placeholder. Secrets come from one Secret named `langfuse` (secret-example.yaml).
# Prerequisites, once per cluster: cert-manager v1.20.2 and clickhouse-operator 0.0.8 (README).

langfuse:
  nextauth:
    url: https://<langfuse.example.internal>     # the address users open; also the OAuth redirect base
    secret:
      secretKeyRef: { name: langfuse, key: nextauth-secret }
  salt:
    secretKeyRef: { name: langfuse, key: salt }
  encryptionKey:                                 # 64 hex characters: openssl rand -hex 32
    secretKeyRef: { name: langfuse, key: encryption-key }
  # Enterprise licence (remove for OSS)
  licenseKey:
    secretKeyRef: { name: langfuse, key: license-key }
  features:
    telemetryEnabled: false
    signUpDisabled: true                         # accounts come from SSO / SCIM

  # web and worker run on the app pool
  nodeSelector:
    workload: app

  web:
    replicas: 2
    resources:
      requests: { cpu: "2", memory: 4Gi }        # the documented minimum per container
      limits: { memory: 4Gi }
    hpa:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 50
    pdb:
      create: true
      maxUnavailable: 1
    # The first start applies every Postgres and ClickHouse migration. With the chart default
    # (20 s + 3 × 10 s) the probe killed web mid-migration and left "Dirty database version 5".
    livenessProbe:
      initialDelaySeconds: 300

  worker:
    replicas: 2
    resources:
      requests: { cpu: "2", memory: 4Gi }
      limits: { memory: 4Gi }
    hpa:                                         # the docs scale workers when 2 CPU passes 50%
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 50
    pdb:
      create: true
      maxUnavailable: 1

  ingress:
    enabled: true                                # class / annotations: the cloud file
    hosts:
      - host: <langfuse.example.internal>
        paths:
          - path: /
            pathType: Prefix
    tls:
      enabled: true
      secretName: langfuse-tls

# ── ClickHouse OSS: 1 shard × 3 replicas + Keeper ×3, through the ClickHouse operator ──
# Langfuse does not support a multi-shard cluster; replicas give availability, not scale-out.
clickhouse:
  deploy: true
  auth:
    existingSecret: langfuse
    existingSecretKey: clickhouse-password
  cluster:
    enabled: true                    # CLICKHOUSE_CLUSTER_ENABLED: ON CLUSTER DDL, ReplicatedMergeTree
    replicas: 3                      # the docs' production minimum; hard to change later
    resources:                       # on 8 vCPU / 32 GiB nodes, leaving room for kubelet and Keeper
      requests: { cpu: "6", memory: 24Gi }
      limits: { memory: 26Gi }
    storage:
      size: 512Gi                    # per replica; every replica holds a full copy. Class: the cloud file
    nodeSelector:
      workload: clickhouse
    tolerations:
      - { key: dedicated, operator: Equal, value: clickhouse, effect: NoSchedule }
    affinity:                        # one replica per node (label set by clickhouse-operator 0.0.8)
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: { clickhouse.com/role: clickhouse-server }
  keeper:
    enabled: true
    replicas: 3
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 2Gi }
    storage:
      size: 20Gi
    nodeSelector:
      workload: app
    affinity:                        # spread over the app pool's nodes when there are 3
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { clickhouse.com/role: clickhouse-keeper }

# ── Managed Postgres, Redis and object storage: the chart's sub-charts off; addresses in the cloud file ──
postgresql:
  deploy: false
  port: 5432
  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse
    secretKeys:
      userPasswordKey: postgresql-password

redis:
  deploy: false
  tls:
    enabled: true
  auth:
    existingSecret: langfuse
    existingSecretPasswordKey: redis-password

s3:
  deploy: false
  bucket: langfuse                               # bucket (S3, GCS) or container (Azure Blob)
  eventUpload: { prefix: "events/" }
  batchExport: { prefix: "exports/" }
  mediaUpload: { prefix: "media/" }
