# Overlay: pass the ingestion knobs of test 01 from the shell to web and worker. Unset or empty = Langfuse's
# own default (Langfuse drops empty variables before parsing its env schema). Defaults, read from
# langfuse/langfuse-worker:4.56.0 /app/worker/dist/env.js and @langfuse/shared dist/src/env.js: README, test 01.
x-knobs: &knobs
  LANGFUSE_INGESTION_CLICKHOUSE_WRITE_BATCH_SIZE: ${LANGFUSE_INGESTION_CLICKHOUSE_WRITE_BATCH_SIZE:-}
  LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS: ${LANGFUSE_INGESTION_CLICKHOUSE_WRITE_INTERVAL_MS:-}
  LANGFUSE_INGESTION_CLICKHOUSE_MAX_ATTEMPTS: ${LANGFUSE_INGESTION_CLICKHOUSE_MAX_ATTEMPTS:-}
  LANGFUSE_OTEL_INGESTION_QUEUE_PROCESSING_CONCURRENCY: ${LANGFUSE_OTEL_INGESTION_QUEUE_PROCESSING_CONCURRENCY:-}
  LANGFUSE_INGESTION_QUEUE_PROCESSING_CONCURRENCY: ${LANGFUSE_INGESTION_QUEUE_PROCESSING_CONCURRENCY:-}
  LANGFUSE_S3_CONCURRENT_WRITES: ${LANGFUSE_S3_CONCURRENT_WRITES:-}
  LANGFUSE_ENABLE_BLOB_STORAGE_FILE_LOG: ${LANGFUSE_ENABLE_BLOB_STORAGE_FILE_LOG:-}
  LANGFUSE_TRACE_BATCH_INGESTION_ENABLED: ${LANGFUSE_TRACE_BATCH_INGESTION_ENABLED:-}
  LANGFUSE_TRACE_BATCH_SAMPLING_RATE: ${LANGFUSE_TRACE_BATCH_SAMPLING_RATE:-}
  LANGFUSE_TRACE_BATCH_MAX_SIZE: ${LANGFUSE_TRACE_BATCH_MAX_SIZE:-}
  LANGFUSE_TRACE_BATCH_DISPATCHER_ENABLED: ${LANGFUSE_TRACE_BATCH_DISPATCHER_ENABLED:-}
  QUEUE_CONSUMER_TRACE_BATCH_QUEUE_IS_ENABLED: ${QUEUE_CONSUMER_TRACE_BATCH_QUEUE_IS_ENABLED:-}

services:
  langfuse-worker:
    environment: *knobs
  langfuse-web:
    environment: *knobs
