# Test 08, third run: HAProxy in front of the three ClickHouse replicas (HTTP :8123), so Langfuse's single
# CLICKHOUSE_URL survives the loss of any one replica. Health check = ClickHouse's /ping; a failed connection is
# retried on another replica (inserts are idempotent per block on Replicated tables).
global
  tune.bufsize 4194304          # 4 MiB: Langfuse's batched INSERT bodies fit, so they can be retried
defaults
  mode http
  timeout connect 2s
  timeout client 120s
  timeout server 120s
  retries 3
  option redispatch 1
  retry-on conn-failure empty-response 502 503 504
  option http-buffer-request
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s
  hold nx 1s
frontend ch
  bind :8123
  default_backend replicas
backend replicas
  balance leastconn
  option httpchk GET /ping
  default-server inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
  server ch1 clickhouse:8123 check
  server ch2 clickhouse-2:8123 check
  server ch3 clickhouse-3:8123 check
