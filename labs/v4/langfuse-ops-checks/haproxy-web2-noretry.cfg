# Test 06a contrast: the same two web replicas, round robin with health checks but no retries. Shows what the
# retry settings of haproxy-web2.cfg are worth.
global
  log stdout format raw local0 notice   # server UP / DOWN only, no per-request lines
  tune.bufsize 1048576
defaults
  log global
  mode http
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  timeout check 3s              # a busy web may take > 1 s to answer /api/public/health
  retries 0
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s
  hold nx 1s
frontend otlp
  bind :80
  default_backend web
backend web
  balance roundrobin
  option httpchk GET /api/public/health
  default-server inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
  server web1 langfuse-web:3000 check
  server web2 langfuse-web-2:3000 check
