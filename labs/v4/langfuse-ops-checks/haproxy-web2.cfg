# HAProxy 3.2 in front of two Langfuse web replicas (test 06a). What matters for loss, in order:
#   retry-on conn-failure …  + option redispatch   a POST that cannot reach a dead web is sent to the other one
#   option http-buffer-request + tune.bufsize      the whole body is buffered first, so L7 retries can resend it
#   option httpchk + inter 1s fall 2               a dead web leaves the pool after ~2 s
#   resolvers docker + init-addr none              a killed container's name stops resolving; it re-enters on start
global
  log stdout format raw local0 notice   # server UP / DOWN only, no per-request lines
  tune.bufsize 1048576          # 1 MiB: one OTLP POST of 1–10 traces (11 KB per observation) fits, so it can be retried
defaults
  log global
  mode http
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  timeout check 3s              # a busy web may take > 1 s to answer /api/public/health
  retries 3
  option redispatch 1           # every retry goes to another server
  retry-on conn-failure empty-response response-timeout 502 503 504
  option http-buffer-request
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 1s
  hold nx 1s
frontend otlp
  bind :80
  default_backend web
backend web
  balance roundrobin
  option httpchk GET /api/public/health
  default-server inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
  server web1 langfuse-web:3000 check
  server web2 langfuse-web-2:3000 check
