# OpenTelemetry Collector contrib 0.162.0 in front of Langfuse (test 06c).
#   receiver   otlp/http on :4318 (the client's endpoint)
#   exporter   otlphttp → http://langfuse-web:3000/api/public/otel (+ /v1/traces), basic auth with the project keys
#   queue      sending_queue in file_storage: accepted spans are on disk before the client gets its 200
#   retries    retry_on_failure, 1 s doubling to 30 s, give up after 300 s per request
# What the exporter retries is not configurable: otlphttp retries 429, 502, 503, 504 and network errors and
# treats every other status, 500 included, as permanent (dropped, `Exporting failed. Dropping data.`). README 06c.
extensions:
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  otlphttp/langfuse:
    endpoint: http://langfuse-web:3000/api/public/otel
    auth:
      authenticator: basicauth/langfuse
    timeout: 30s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      num_consumers: 10
      queue_size: 100000
service:
  extensions: [file_storage/queue, basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlphttp/langfuse]
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
